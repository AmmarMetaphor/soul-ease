# Soul Ease — Netlify configuration
#
# Environment variables are configured in the Netlify UI
# (Site configuration → Environment variables). See .env.example for the list.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Serverless endpoints live under /api/*. The realtime token function declares
# its own path via `export const config`, so no redirect is needed for it.

# SPA fallback: every non-file route is served by index.html so that a browser
# refresh on /app/journal or /session/abc still loads the React router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
